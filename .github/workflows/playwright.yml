name: Playwright Tests
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  playwright-tests:
    timeout-minutes: 15
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout and clone the repository
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install

      - name: Get the Vercel preview url
        id: vercel_preview_url
        uses: zentered/vercel-preview-url@v1.4.0
        with:
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel_app: 'beskydske-tury-v2'

      - name: Wait for Vercel deployment to be ready
        uses: UnlyEd/github-action-await-vercel@v2.0.0
        with:
          deployment-url: ${{ format('https://{0}', steps.vercel_preview_url.outputs.preview_url) }}
          timeout: 420
          poll-interval: 15

      - name: Run your tests
        env:
          BASE_URL: ${{ format('https://{0}', steps.vercel_preview_url.outputs.preview_url) }}
        run: pnpm exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
