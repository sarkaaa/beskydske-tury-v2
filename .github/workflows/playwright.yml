name: Playwright Tests
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  playwright:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    env:
      MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_USE_CDN: ${{ vars.SANITY_USE_CDN }}
      SANITY_APP_ID: ${{ secrets.SANITY_APP_ID }}
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install
      - name: Run your tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
